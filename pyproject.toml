[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "crypto-agility-control-plane"
version = "0.1.0"
description = "Evidence-driven cryptographic inventory, risk analysis, migration planning, and post-quantum benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy" }]
dependencies = [
  "cryptography>=44,<48",
  "fastapi>=0.139.2,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
crypto-agility = "crypto_agility.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_agility"]

[tool.hatch.build.targets.wheel.force-include]
"data/algorithm-registry.json" = "crypto_agility/resources/algorithm-registry.json"
"config/risk-policy.yaml" = "crypto_agility/resources/risk-policy.yaml"
"schemas/cbom-1.0.0.schema.json" = "crypto_agility/resources/cbom-1.0.0.schema.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires native liboqs or network/container resources",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["crypto_agility"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["crypto_agility"]

[tool.coverage.report]
show_missing = true
skip_covered = true
